# Тема приложения: тёмная по умолчанию. Светлая включается переключателем
# в боковой панели (?theme=light) или выбором темы в меню Settings —
# тонкая настройка поверх выполняется через CSS в app/ui/styles.py.
[theme]
base = "dark"
primaryColor = "#7D85EC"
backgroundColor = "#0E0F13"
secondaryBackgroundColor = "#1D1F26"
textColor = "#EDEEF2"
font = "sans serif"

# Убираем «Deploy» и прочий служебный хром из шапки, но оставляем меню
# Settings: выбор темы там (Light/Dark) перекрашивает и таблицу-редактор.
[client]
toolbarMode = "viewer"
