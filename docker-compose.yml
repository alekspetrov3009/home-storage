# Домашний склад: REST API (FastAPI) + интерфейс (nginx со статикой React).
# Запуск: docker compose up -d --build   →   http://localhost:8080
# Файл данных живёт на хосте в ./data (том /data в контейнере backend).
services:
  api:
    build: ./backend
    restart: unless-stopped
    # Один процесс uvicorn: блокировка файла данных действует только
    # внутри процесса, --workers N не поддерживается (см. README).
    environment:
      DATA_FILE: /data/inventory.xlsx
      BASE_URL: ${BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./data:/data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
