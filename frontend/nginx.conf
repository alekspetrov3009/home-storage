# Домашний склад — статика фронтенда + проксирование API на backend-контейнер.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # История роутера и deep links (/box?box=…): всё неизвестное — на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика Vite хешируется в именах файлов
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API (и доки) — на backend-контейнер compose-сети
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
