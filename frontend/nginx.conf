# Домашний склад — статика фронтенда + проксирование API на backend-контейнер.
# Файл подключается в http-контекст (/etc/nginx/conf.d/*.conf), поэтому зоны
# limit_req_zone объявляются здесь же, до server-блока.

# Общий лимит API: 30 запросов/с с адреса (burst 20).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Лимит авторизации: 10 попыток/мин с адреса (burst 10). Защита от перебора
# паролей и от DoS на PBKDF2 (600k итераций на попытку — минуты CPU при флуде).
limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Превышение лимитов — не 503 (выглядит как сбой), а честный 429.
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    # Security-заголовки. Внимание: nginx НЕ наследует add_header в location,
    # где объявлен собственный add_header — такие location повторяют их сами
    # (ниже: /assets/ и /theme-boot.js).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: скрипты и соединения — только со своего origin (inline-скриптов в
    # сборке нет, тема подключается файлом /theme-boot.js); стили с
    # 'unsafe-inline' — React расставляет стили атрибутами.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # История роутера и deep links (/box?box=…): всё неизвестное — на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика Vite хешируется в именах файлов
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Загрузчик темы до первой отрисовки (см. frontend/public/theme-boot.js)
    location = /theme-boot.js {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # REST API (и доки) — на backend-контейнер compose-сети
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # $http_host сохраняет порт из запроса (нужен для проверки Origin,
        # когда склад открыт на нестандартном порту); $host его затирает.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Авторизация — свой лимит (перебор паролей, DoS на PBKDF2).
    # Префикс длиннее /api/, поэтому login/register/logout/change-password
    # обслуживаются этим location и попадают только на зону auth.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
}
